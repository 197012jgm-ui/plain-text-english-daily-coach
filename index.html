$("rec").onclick=()=>rec(v=>{let a=new Set(v.toLowerCase().replace(/[^a-z ]/g,"").split(" ")),b=new Set(c[3][0].toLowerCase().replace(/[^a-z ]/g,"").split(" ")),h=0;a.forEach(x=>b.has(x)&&h++);$("heard").textContent="你说："+v;$("sf").innerHTML=h/Math.max(a.size,b.size)>=.75?"<span class=good>✓ 很好，基本正确。</span>":"<span class=bad>△ 再练一次。目标句："+c[3][0]+"</span>"});
function bubble(x,m=false){let d=document.createElement("div");d.className="bubble "+(m?"me":"");d.textContent=x;$("cb").appendChild(d);$("cb").scrollTop=$("cb").scrollHeight}
function chat(){ $("cb").innerHTML="";bubble("Hello! Let's practice "+c[0]+". "+c[3][0])}
function reply(v){let n=v.toLowerCase();if(n.split(" ").length<4)return"Good start. Try a complete sentence with 4 or more words.";if(n.includes("thank"))return"Good. You can say: Thank you very much. I appreciate your help.";if(n.includes("fertilizer"))return"Good. A natural sentence is: Where can I find the fertilizer?";return"Good attempt. Your meaning is clear. Try adding one more detail."}
$("send").onclick=()=>{let v=$("ci").value.trim();if(!v)return;bubble(v,true);$("ci").value="";setTimeout(()=>bubble(reply(v)),150)};$("voice").onclick=()=>rec(v=>{$("ci").value=v;$("send").click()});
function review(){ $("weak").innerHTML=Object.keys(S.weak).length?Object.entries(S.weak).map(x=>"<div class=item><b>"+x[0]+"</b> · 错误 "+x[1]+" 次　<button onclick="say('"+x[0]+"')">🔊</button></div>").join(""):"目前没有薄弱词。";$("errors").innerHTML=S.errors.length?S.errors.map(x=>"<div class=item>"+x+"</div>").join(""):"暂无错误。"}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");["today","learn","speak","chat","review"].forEach(x=>$(x).classList.add("hidden"));$(b.dataset.x).classList.remove("hidden");if(b.dataset.x==="review")review()});
$("start").onclick=()=>document.querySelector('[data-x=learn]').click();$("bell").onclick=async()=>{if("Notification"in window){let p=await Notification.requestPermission();if(p==="granted"){new Notification("English Daily Coach",{body:"英语每日训练时间到了。"});$("bell").textContent="✓"}}};
render();chat();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></main></body></html>
